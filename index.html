<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1d20"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Тахограф UA</title>
<style>
:root{--bg:#e9ecef;--fg:#1b1d20;--card:#fff;--lcd:#c5d3a8;--lcdf:#1d2a12}
[data-t=dark]{--bg:#121416;--fg:#e9ecef;--card:#22262a;--lcd:#9fb184}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
nav{display:flex;position:sticky;top:0;background:var(--card);z-index:2}
nav button{flex:1;padding:14px 2px;border:0;background:none;color:var(--fg);font-weight:700;font-size:12px;border-bottom:3px solid transparent}
nav .on{border-color:#e8a317}
main{max-width:420px;margin:0 auto;padding:10px}
section{display:none}section.on{display:block}
.dev{background:#17181a;border:2px solid #2d2f33;border-radius:10px;padding:10px}
.top{display:flex;justify-content:space-between;color:#9a9da3;font:700 11px sans-serif;letter-spacing:3px;padding:0 4px 6px}
.lcd{background:var(--lcd);color:var(--lcdf);font:700 14px/1.5 ui-monospace,monospace;border:3px solid #111;border-radius:4px;height:186px;padding:4px 6px 30px;overflow:hidden;position:relative}
.lcd .sel{background:var(--lcdf);color:var(--lcd);padding:0 3px}
.lcd .hd{border-bottom:1px solid;font-size:12px;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.lcd .ht{font-size:11px;font-weight:400;opacity:.8}
.lcd .m{position:absolute;left:6px;right:6px;bottom:3px;border-top:1px solid;padding-top:2px;font-size:12px;min-height:22px}
.big{font-size:26px;line-height:1.3}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1;min-height:46px;background:#222428;border:1px solid #3c3f44;border-radius:4px;color:#eee;font-size:17px;font-weight:700}
.row .ok{background:#e8a317;color:#111}
.bt button{font-size:15px}
.sl{flex:3;background:#101113;border:1px solid #33363a;border-radius:3px;color:#777;font:11px sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px}
.sl.in{color:#8f8;border-color:#3c3}.sl.rd{color:#fc3;border-color:#fc3}
.act{margin-top:8px;color:#9a9da3;font:11px sans-serif}.act .row{margin-top:4px}.act button{font-size:20px;min-height:42px}.act .on{outline:3px solid #e8a317}
.ex{margin-top:10px;width:100%;padding:12px;border-radius:10px;border:0;background:var(--card);color:var(--fg);font-size:15px;font-weight:700}
.mod{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}.mod.on{display:flex}
.mod div{background:var(--card);padding:18px;border-radius:18px 18px 0 0;width:100%;max-height:80%;overflow:auto;line-height:1.5}
.mod button,.set button{padding:8px 14px;border-radius:8px;border:0;background:#e8a317;font-weight:700}
details{background:var(--card);margin:6px 0;border-radius:10px;padding:10px 12px}summary{font-weight:700}details p{margin:6px 0}
h3{margin:16px 0 4px}
.set{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);padding:12px;border-radius:10px;margin:8px 0}
.set input{font-size:14px;max-width:190px}
</style></head><body>
<nav><button class=on onclick=tab(0)>ТАХОГРАФ</button><button onclick=tab(1)>ДОВІДНИК</button><button onclick=tab(2)>НАЛАШТУВАННЯ</button></nav>
<main>
<section class=on id=s0>

<div class=top><span>ТАХОГРАФ</span><span>СИМУЛЯТОР</span></div>

<div class=act>Діяльність водія 1:<div class=row id=ab></div></div>
</div>

<section id=s2>
<div class=set>Звук<button id=bs onclick="tog('snd')"></button></div>
<div class=set>Тема<button id=bt onclick="tog('dark')"></button></div>

<div class=set>Скинути стан симулятора<button onclick=reset()>Скинути</button></div>
</section>
</main>
<div class=mod id=mod onclick="if(event.target==this)this.classList.remove('on')"><div><h3 id=mt></h3><p id=ms></p><button onclick="mod.classList.remove('on')">Закрити</button></div></div>
<script>

const CN=['Австрія','Албанія','Бельгія','Білорусь','Болгарія','Боснія і Герцеговина','Велика Британія','Греція','Данія','Естонія','Ірландія','Ісландія','Іспанія','Італія','Латвія','Литва','Люксембург','Молдова','Нідерланди','Німеччина','Норвегія','Польща','Португалія','Румунія','Сербія','Словаччина','Словенія','Угорщина','Україна','Фінляндія','Франція','Хорватія','Чехія','Чорногорія','Швейцарія','Швеція'];

const R=[[1,31],[1,12],[2020,2040],[0,23],[0,59],[0,3]],MS=['Дата: день','Дата: місяць','Дата: рік','Час: години','Час: хвилини','Діяльність'];
const EX={
home:['Головний екран','Показує час і дату симулятора, поточний режим (символ), початок і кінець країни. Натисніть OK — відкриється меню. Карти вставляються кнопками 👤1 і 👤2.'],
menu:['Меню','▲▼ — вибір пункту, OK — відкрити, ↩ — на головний екран. Угорі дисплея завжди видно, де ви зараз.'],
manual:['Ручне введення','Вносить діяльність, яка не записалась автоматично (наприклад, поки карти не було). Проходьте поля: ▲▼ змінюють, OK — далі, ↩ — назад.'],
mdate:['Ручне введення: дата','Виберіть день, місяць і рік початку періоду. ▲▼ змінюють значення, OK — наступне поле, ↩ — попереднє.'],
mtime:['Ручне введення: час','Виберіть години й хвилини початку періоду. ▲▼ змінюють, OK — далі.'],

const F=[
['Вставлення карти водія','Карта — ваш особистий електронний «ключ» водія.','Щоб тахограф записував діяльність саме вам.','Натисніть 👤1 (або слот поруч). Для другого водія — 👤2.','Дисплей: «Зчитування картки…», далі «Карта активна» і запит про ручне введення. Слот стає зеленим.','Початок зміни: вставили карту, відповіли на запит, обрали початок країни.'],
['Виймання карти','Завершення роботи з картою.','Щоб закінчити зміну й забрати карту.','Натисніть 👤1 ще раз, коли карта активна.','Дисплей: «Карту вийнято», слот порожній, екран головний.','Кінець зміни: виберіть кінець країни, потім вийміть карту.'],
['Режими діяльності','Чотири стани: 🚛 керування, ⚒️ інша робота, ⏳ доступність, 🛏️ відпочинок.','Щоб час записувався у правильну категорію.','Меню → Режим діяльності → ▲▼ → OK. Або кнопки діяльності під пристроєм.','Символ на головному екрані змінюється, режим зберігається.','Стоїте на розвантаженні — виберіть ⚒️ «Інша робота».'],
['Ручне введення','Внесення діяльності за період, який тахограф не записав.','Щоб без прогалин показати, що ви робили.','Меню → Ручне введення. Дата ▲▼ OK → час ▲▼ OK → діяльність ▲▼ OK → підтвердити OK.','Після підтвердження введення завершується, режим оновлюється. ↩ повертає на крок назад.','Карту вставили зранку, а до цього відпочивали — вносите 🛏️.'],
['Початок країни','Країна, де починається ваш робочий день.','Для обліку країни початку зміни.','Меню → Початок країни → ▲▼ → OK.','Головний екран показує «Поч.: …». Кінець країни не змінюється.','Зміну починаєте в Польщі — виберіть «Польща».'],
['Кінець країни','Країна, де завершується робочий день.','Для обліку країни кінця зміни.','Меню → Кінець країни → ▲▼ → OK.','Головний екран показує «Кін.: …». Початок країни не змінюється.','Зміну завершуєте в Німеччині — виберіть «Німеччина».'],
['Пором / поїзд','Стан, коли авто перевозять поромом або поїздом.','Щоб тахограф знав про такий період.','Меню → Пором / поїзд → OK (повторне OK вимикає).','Дисплей: «Пором/поїзд активний» або «неактивний». На головному екрані при активному — 🚢.','Заїхали на пором — активуйте; з’їхали — вимкніть.'],
['Меню і навігація','Список функцій, що відкривається з головного екрана.','Щоб знайти потрібну функцію.','OK на головному екрані → ▲▼ → OK. ↩ — на крок назад.','Верхній рядок дисплея показує шлях: «Меню › …».','Меню › Початок країни › вибір країни.'],
['Час симулятора','Власний час симулятора, не час телефону.','Щоб усі дії відбувались у заданий вами час.','Налаштування → «Час симулятора»: задайте дату й час, можна вмикати/вимикати автоматичний хід.','Головний екран і ручне введення беруть цей час.','Ставите 08:00 і тренуєте ручне введення на цей ранок.']];
const FL=['Що це означає','Для чого використовується','Що натискати','Що відбувається після натискання','Приклад'];
const B=[
['↩ Назад','Крок назад: у меню — на головний екран, у ручному введенні — до попереднього поля.'],
['▲ (Вгору)','Переміщення вгору списком або збільшення значення поля.'],
['▼ (Вниз)','Переміщення вниз списком або зменшення значення поля.'],
['OK','Вибір пункту, перехід до наступного поля, підтвердження. На головному екрані відкриває меню.'],
['👤1 Водій 1','Кнопка першого водія: вставляє карту 1, а коли карта активна — виймає її.'],
['👤2 Водій 2','Те саме для карти другого водія.'],
['Слот карти','Місце, де «лежить» карта. Темний — порожній, жовтий — зчитування, зелений — карта активна.'],
['Дисплей','Малий монохромний екран. Угорі — де ви (режим або шлях меню), посередині — дані, внизу — повідомлення (ℹ інформація, ⚠ увага). Виділений пункт — темна смуга.'],
['Кнопки діяльності','Чотири кнопки під пристроєм: швидко змінюють режим водія 1 (🚛 ⚒️ ⏳ 🛏️). Потрібна карта 1.']];
const Y=[
['🚛','Керування','Ви ведете автомобіль.','Символ біля часу; угорі «Режим: Керування».'],
['⚒️','Інша робота','Робота, що не є керуванням: завантаження, огляд, документи.','Символ біля часу; угорі «Режим: Інша робота».'],
['⏳','Доступність','Ви готові до роботи, але зараз не працюєте безперервно (наприклад, очікуєте).','Символ біля часу; угорі «Режим: Доступність».'],

['👤1 / 👤2','Карта водія','Карта першого або другого водія.','Слот зелений, коли карта активна.'],

const fresh=()=>({c1:0,c2:0,mode:'rest',ferry:0,startCountry:'',endCountry:'',scr:'home',i:0,kind:'cstart',sim:Date.UTC(2026,9,2,8,0),auto:1,snd:1,dark:0});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage[K]));S.scr='home';S.i=0;if(S.c1==1)S.c1=2;if(S.c2==1)S.c2=2}catch(e){S=fresh()}
let man=null,mt,AC;
const save=()=>{try{localStorage[K]=JSON.stringify(S)}catch(e){}};

const T=()=>{const d=new Date(S.sim);return[d.getUTCDate(),d.getUTCMonth()+1,d.getUTCFullYear(),d.getUTCHours(),d.getUTCMinutes()]};
function render(){
const sc=S.scr,t=T();let h='';
if(sc=='home')h=hd('Режим: '+MODES[S.mode][1])+`<div class=big>${p(t[3])}:${p(t[4])} ${MODES[S.mode][0]}</div><div>${p(t[0])}.${p(t[1])}.${t[2]}</div><div>Поч.: ${S.startCountry||'—'}</div><div>Кін.: ${S.endCountry||'—'}</div>${S.ferry?'<div>🚢 Пором/поїзд активний</div>':''}`;

else if(sc=='country')h=hd('Меню › '+(S.kind=='cstart'?'Початок':'Кінець')+' країни')+list(CN,S.i);
else if(sc=='mode')h=hd('Меню › Режим діяльності')+list(MK.map(k=>MODES[k][0]+' '+MODES[k][1]),S.i);

else if(sc=='info')h=hd('Меню › Інформація')+`<div>Карта 1: ${['відсутня','…','активна'][S.c1]} Карта 2: ${['відсутня','…','активна'][S.c2]}</div><div>Режим: ${MODES[S.mode][1]}</div><div>Поч.: ${S.startCountry||'—'}</div><div>Кін.: ${S.endCountry||'—'}</div><div>Пором: ${S.ferry?'активний':'неактивний'}</div>`;

h=hd(`Меню › Ручне введення ${Math.min(s+1,6)}/6`)+(s==6?`<div>${p(f[0])}.${p(f[1])}.${f[2]} ${p(f[3])}:${p(f[4])}</div><div>${MODES[MK[f[5]]][0]} ${MODES[MK[f[5]]][1]}</div><div class=sel>OK — підтвердити</div><div class=ht>↩ — виправити</div>`:`<div>Дата: ${F(0,p(f[0]))}.${F(1,p(f[1]))}.${F(2,f[2])}</div><div>Час: ${F(3,p(f[3]))}:${F(4,p(f[4]))}</div><div>Діяльність: ${F(5,MODES[MK[f[5]]][0]+' '+MODES[MK[f[5]]][1])}</div><div class=ht>${MS[s]} · ▲▼ змінити · OK далі</div>`)}
$('#scr').innerHTML=h;
for(const n of[1,2]){const c=S['c'+n],e=$('#sl'+n);e.textContent=['слот карти '+n,'Зчитування…','Карта '+n+' ✔'][c];e.className='sl'+(c==2?' in':c==1?' rd':'')}
$('#ab').innerHTML=MK.map(k=>`<button class="${S.mode==k?'on':''}" onclick="setMode('${k}')">${MODES[k][0]}</button>`).join('');
$('#bs').textContent=S.snd?'Увімк.':'Вимк.';$('#bt').textContent=S.dark?'Темна':'Світла';$('#ba').textContent=S.auto?'Іде':'Стоїть';
document.documentElement.dataset.t=S.dark?'dark':'';save()}
function setMode(k){if(S.c1!=2)return say('Карта не вставлена',1);S.mode=k;say('Режим: '+MODES[k][1]);render()}
function startMan(){man={s:0,f:[...T(),0]};S.scr='manual'}
function card(n){const c='c'+n;if(S[c]==1)return;
if(S[c]==2){S[c]=0;say('Карту '+n+' вийнято');if(n==1)S.scr='home'}
else{S[c]=1;S.scr='read';S.rd=n;say('Карту '+n+' вставлено');setTimeout(()=>{S[c]=2;say('Карта '+n+' активна');S.scr='home';if(n==1){S.scr='askman';S.i=0}render()},2200)}
render()}
function key(k){const sc=S.scr;if(sc=='read')return;const L={menu:6,country:CN.length,mode:4,askman:2},dir=k=='up'?-1:k=='down'?1:0;
if(dir&&L[sc])S.i=(S.i+dir+L[sc])%L[sc];
else if(dir&&sc=='manual'){if(man.s<6){const r=R[man.s],n=r[1]-r[0]+1;man.f[man.s]=r[0]+(man.f[man.s]-r[0]+dir+n)%n}}
else if(k=='back'){if(sc=='manual')man.s>0?man.s--:S.scr='menu';else if(['menu','askman'].includes(sc))S.scr='home';else if(sc!='home')S.scr='menu'}
else if(k=='ok'){
if(sc=='home'){S.scr='menu';S.i=0}
else if(sc=='menu'){const t=MENU[S.i][1];
if(t=='manual')S.c1==2?startMan():say('Карта не вставлена',1);
else if(t=='cstart'||t=='cend'){S.kind=t;S.scr='country';S.i=Math.max(0,CN.indexOf(t=='cstart'?S.startCountry:S.endCountry))}
else if(t=='mode'){S.scr='mode';S.i=MK.indexOf(S.mode)}
else S.scr=t}
else if(sc=='country'){const s=S.kind=='cstart';S[s?'startCountry':'endCountry']=CN[S.i];say((s?'Початок: ':'Кінець: ')+CN[S.i]);S.scr='home'}
else if(sc=='mode'){if(S.c1==2){S.mode=MK[S.i];say('Режим: '+MODES[S.mode][1]);S.scr='home'}else say('Карта не вставлена',1)}
else if(sc=='ferry'){S.ferry^=1;say(S.ferry?'Пором/поїзд активний':'Пором/поїзд неактивний');S.scr='home'}
else if(sc=='askman'){S.i==0?startMan():S.scr='home'}
else if(sc=='manual'){if(man.s<6)man.s++;else{S.mode=MK[man.f[5]];say('Введення завершено');S.scr='home'}}
else if(sc=='info')S.scr='menu'}
render()}
function expl(){const sc=S.scr;let k=sc=='menu'?MENU[S.i][1]:sc=='country'?S.kind:sc=='manual'?['mdate','mdate','mdate','mtime','mtime','mact','mok'][man.s]:sc;const e=EX[k]||EX.home;$('#mt').textContent='ⓘ '+e[0];$('#ms').textContent=e[1];$('#mod').classList.add('on')}
function tab(n){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i==n));document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==n));if(n==2)$('#dt').value=new Date(S.sim).toISOString().slice(0,16)}
function tog(k){S[k]^=1;render()}
function setT(){const v=Date.parse($('#dt').value+':00Z');if(isNaN(v))return alert('Вкажіть дату і час');S.sim=v;render()}
function reset(){if(confirm('Скинути стан симулятора?')){const s=[S.snd,S.dark];S=fresh();[S.snd,S.dark]=s;man=null;render();tab(0)}}
const D=(t,b)=>`<details><summary>${t}</summary>${b}</details>`;
$('#hb').innerHTML='<h3>Функції</h3>'+F.map(f=>D(f[0],f.slice(1).map((x,i)=>`<p><b>${FL[i]}:</b> ${x}</p>`).join(''))).join('')+'<h3>Кнопки та дисплей</h3>'+B.map(b=>D(b[0],`<p>${b[1]}</p>`)).join('')+'<h3>Символи тахографа</h3>'+Y.map(y=>D(y[0]+' '+y[1],`<p><b>Символ:</b> ${y[0]}</p><p><b>Що означає:</b> ${y[2]}</p><p><b>На дисплеї:</b> ${y[3]}</p>`)).join('');
render();setInterval(()=>{if(S.auto)S.sim+=1000;if(S.scr=='home')render()},1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
